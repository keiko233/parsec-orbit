[package]
name = "parsec-orbit-plugin-native"
description = "Parsec Orbit plugin that patches the native (libmatoya) client UI in memory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "parsec_orbit_plugin_native"
crate-type = ["cdylib"]

[dependencies]
parsec-orbit-plugin-sdk = { path = "../../parsec-orbit-plugin-sdk" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
] }
