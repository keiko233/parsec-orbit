[package]
name = "parsec-orbit-plugin-high-bitrate-webview"
description = "Parsec Orbit plugin that patches the WebView2 client UI at runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The loader maps the cdylib. No rlib: a `no_std` plugin expands
# `freestanding!` here, which would clash with the `std` of any binary that
# linked it. The tools read `assets/bandwidth.js` directly.
[lib]
name = "parsec_orbit_plugin_high_bitrate_webview"
crate-type = ["cdylib"]

[dependencies]
parsec-orbit-plugin-sdk = { path = "../../crates/parsec-orbit-plugin-sdk" }

[dev-dependencies]
parsec-orbit-plugin-sdk-testing = { path = "../../crates/parsec-orbit-plugin-sdk-testing" }
serde_json = "1"
