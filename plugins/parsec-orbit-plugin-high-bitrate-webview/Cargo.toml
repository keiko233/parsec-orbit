[package]
name = "parsec-orbit-plugin-high-bitrate-webview"
description = "Parsec Orbit plugin that patches the WebView2 client UI at runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The loader maps the cdylib; the rlib exists so the verification tools can
# drive the same DevTools client without a second copy of the code.
[lib]
name = "parsec_orbit_plugin_high_bitrate_webview"
crate-type = ["cdylib", "rlib"]

[dependencies]
parsec-orbit-plugin-sdk = { path = "../../crates/parsec-orbit-plugin-sdk" }

[dev-dependencies]
serde_json = "1"
