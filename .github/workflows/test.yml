# Runs the whole test suite on every push to main and on every pull request.
#
# The suite covers the SDK, the loader, both official plugins and the example,
# plus end-to-end tests that build the loader and the plugins and run them in
# a real process. It needs Windows: the loader is a bcrypt.dll proxy.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    env:
      # The behaviour tests of the injected WebView script run on Node; fail
      # instead of silently skipping if it is ever missing.
      PARSEC_ORBIT_REQUIRE_NODE: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      # pnpm comes first: setup-node's pnpm cache needs it on PATH, and the
      # action reads the pinned `packageManager` version from package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # Builds the TypeScript SDK, then the sample that the end-to-end tests
      # load (the sample type-checks against the SDK's built declarations).
      - name: JavaScript SDK and sample
        run: |
          pnpm install --frozen-lockfile
          pnpm -r build
          pnpm -r test

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --workspace --locked

      # The crates that go to crates.io must package and build from their own
      # tarballs. Nothing is published here.
      - name: Package the SDK crates
        run: cargo package -p parsec-orbit-plugin-abi -p parsec-orbit-plugin-sdk -p parsec-orbit-plugin-sdk-std --locked
