# Builds and publishes a release when a version tag is pushed.
# Preferred entry point is Actions -> Publish -> Run workflow: it bumps the
# workspace version, commits, tags, and pushes; the tag push triggers this
# workflow. Two separate workflows so this job always checks out the bump
# commit behind the tag.
# Manual tagging still works:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# The tag must match the workspace version in Cargo.toml. The release contains
# the loader (bcrypt.dll), the official plugins, the example plugin, the
# market tool, the signed plugin index (index.json) and the signed
# distribution manifest (release.json), plus checksums. package.ps1 signs the
# two JSON files when the MARKET_SIGNING_KEY secret is set (the content of a
# `.key` file made by `parsec-orbit-market keygen`); without it the release is
# still published but the files are unsigned. Release notes are built with
# git-cliff (see cliff.toml).
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # git-cliff reads pull request metadata from the API while building the
  # changelog; contents: write alone leaves that call unauthorized.
  pull-requests: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags so git-cliff can diff against the previous tag.
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # A tag that disagrees with Cargo.toml would publish a mislabelled
      # release, so fail before spending time on the build.
      - name: Check the tag against the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          if (-not $match) { throw 'could not read the workspace version from Cargo.toml' }
          $version = 'v' + $match.Matches[0].Groups[1].Value
          if ('${{ github.ref_name }}' -ne $version) {
            throw "tag ${{ github.ref_name }} does not match the workspace version $version"
          }
          Write-Host "releasing $version"

      # Downloads the pinned git-cliff release and puts it on PATH. The
      # git-cliff-action wrapper keeps its copy inside the action cache and
      # never exports it, so it cannot be called from later steps.
      - name: Install git-cliff
        shell: pwsh
        run: |
          $version = 'v2.14.2'
          $name = "git-cliff-$($version.TrimStart('v'))-x86_64-pc-windows-msvc.zip"
          $dir = Join-Path $env:RUNNER_TEMP 'git-cliff'
          $archive = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri "https://github.com/orhun/git-cliff/releases/download/$version/$name" -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force
          $bin = (Get-ChildItem -LiteralPath $dir -Recurse -Filter git-cliff.exe | Select-Object -First 1).DirectoryName
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'git-cliff.exe') --version

      # Builds the release notes from conventional commits. On a tag this is
      # the current version section; on a manual branch run it previews
      # unreleased commits. The full CHANGELOG.md is staged into dist/ below
      # so it ships as a release asset.
      - name: Build the changelog with git-cliff
        shell: pwsh
        env:
          # git-cliff reads PR metadata from the GitHub API; without a token
          # the anonymous call from a shared runner IP can be rate limited.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            git-cliff --latest --strip all --output RELEASE_NOTES.md
          } else {
            git-cliff --unreleased --strip all --output RELEASE_NOTES.md
          }
          git-cliff --output CHANGELOG.md
          Write-Host '--- release notes ---'
          Get-Content RELEASE_NOTES.md

      - name: Build
        run: cargo build --release --locked

      # Loads the freshly built loader and checks the forwarding paths against
      # known-answer vectors. Also rebuilds without the diagnostics feature, so
      # the artifact staged below is the plain release build.
      - name: Verify the loader
        shell: pwsh
        run: ./scripts/verify.ps1

      - name: Package and sign the release files
        shell: pwsh
        env:
          MARKET_SIGNING_KEY: ${{ secrets.MARKET_SIGNING_KEY }}
        run: |
          if ($env:MARKET_SIGNING_KEY) {
            $key = Join-Path $env:RUNNER_TEMP 'parsec-orbit-market.key'
            Set-Content -LiteralPath $key -Value $env:MARKET_SIGNING_KEY -NoNewline -Encoding ascii
            try {
              ./scripts/package.ps1 -SkipBuild -SigningKeyFile $key
            } finally {
              Remove-Item -LiteralPath $key -Force -ErrorAction SilentlyContinue
            }
          } else {
            Write-Warning 'MARKET_SIGNING_KEY is not set: the manifests will be unsigned'
            ./scripts/package.ps1 -SkipBuild
          }

      - name: Stage the changelog into dist
        shell: pwsh
        run: |
          # package.ps1 already wrote SHA256SUMS.txt, so regenerate it to
          # cover CHANGELOG.md as well.
          Copy-Item -LiteralPath CHANGELOG.md -Destination (Join-Path dist CHANGELOG.md)
          Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            } |
            Set-Content -Encoding ascii (Join-Path dist 'SHA256SUMS.txt')
          Get-ChildItem dist/

      - uses: actions/upload-artifact@v7
        with:
          name: parsec-orbit-${{ github.ref_name }}
          path: dist/*

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md

  # Publishes @parsec-orbit/sdk for the same tag. The Publish workflow bumps
  # javascript-sdk/package.json to the workspace version, so the tag and the
  # npm version always agree. Needs an npm automation token with publish
  # rights for the @parsec-orbit scope in the NPM_TOKEN secret; npm trusted
  # publishing can replace the secret once the package exists (the id-token
  # permission below is already in place).
  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Check the tag against the SDK version
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./javascript-sdk/package.json').version")"
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match the SDK version $VERSION" >&2
            exit 1
          fi
          # A prerelease must not become the version plain `npm install`
          # resolves to, so it goes out under the next dist-tag instead.
          if [[ "$VERSION" == *-* ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test the SDK
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @parsec-orbit/sdk build
          pnpm --filter @parsec-orbit/sdk test

      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./javascript-sdk/package.json').version")"
          # Re-running a release for a tag that is already on npm (for
          # example to replace a failed build) must not fail here.
          if npm view "@parsec-orbit/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "@parsec-orbit/sdk@$VERSION is already published; nothing to do"
            exit 0
          fi
          pnpm --filter @parsec-orbit/sdk publish \
            --access public \
            --provenance \
            --no-git-checks \
            --tag "${{ steps.sdk.outputs.dist_tag }}"
