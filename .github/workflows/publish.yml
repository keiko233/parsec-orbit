# Publishes a new version: bumps the workspace version, commits, tags, and
# pushes. Pushing the tag triggers the Release workflow, which builds,
# verifies, packages, and publishes the GitHub release with a git-cliff
# changelog. Two separate workflows so Release always checks out the bump
# commit behind the tag.
#
# Requires Settings -> Actions -> General -> Workflow permissions set to
# "Read and write permissions" so this workflow can push the bump commit
# and the version tag.
#
# Run from the Actions tab: Publish -> Run workflow -> version e.g. 0.1.0.
# A leading "v" is accepted and stripped (v0.1.0 -> 0.1.0).
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version without the leading v (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Bumps [workspace.package] version in Cargo.toml, refreshes Cargo.lock,
      # commits both, and pushes the commit plus the version tag. The tag push
      # is what triggers the Release workflow.
      - name: Bump the workspace version, commit, and tag
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION_INPUT#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid version: $VERSION_INPUT (expected e.g. 0.1.0)" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "publishing $TAG from $REF_NAME"

          git fetch --tags origin
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists" >&2
            exit 1
          fi

          CURRENT="$(sed -n -E 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$CURRENT" ]; then
            echo "could not read the workspace version from Cargo.toml" >&2
            exit 1
          fi
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "Cargo.toml is already at $VERSION; nothing to bump" >&2
            exit 1
          fi
          echo "bumping $CURRENT -> $VERSION"

          python3 - "$VERSION" <<'EOF'
          import re
          import sys
          version = sys.argv[1]
          path = "Cargo.toml"
          with open(path, encoding="utf-8") as f:
              src = f.read()
          out, n = re.subn(r'(?m)^version = "[^"]+"$', 'version = "' + version + '"', src, count=1)
          if n != 1:
              raise SystemExit("workspace version line not found in Cargo.toml")
          # The crates published to crates.io name each other with a version.
          out, n = re.subn(
              r'(?m)^(parsec-orbit-plugin-[a-z-]+ = \{ path = "[^"]+", version = ")[^"]+(" \})$',
              lambda m: m.group(1) + version + m.group(2),
              out,
          )
          if n < 1:
              raise SystemExit("workspace dependency versions not found in Cargo.toml")
          with open(path, "w", encoding="utf-8", newline="") as f:
              f.write(out)
          EOF

          # Refreshes the workspace member versions inside Cargo.lock without
          # compiling anything, so this step also works on ubuntu-latest.
          # NOTE: --no-deps must NOT be used here; it skips the lockfile
          # update and Release's `cargo build --locked` would then fail.
          cargo metadata --format-version 1 >/dev/null

          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): publish $TAG"
          git push origin "HEAD:$REF_NAME"
          git tag "$TAG"
          git push origin "$TAG"
          echo "pushed $TAG; Release starts on the tag event."
