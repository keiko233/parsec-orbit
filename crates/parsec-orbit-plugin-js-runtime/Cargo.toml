[package]
name = "parsec-orbit-plugin-js-runtime"
description = "Parsec Orbit plugin that runs JavaScript plugins (kind = \"js\") on the Boa engine and provides parsec-orbit.js"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Boa 0.22 needs it.
rust-version = "1.91"

# The loader maps the cdylib; the rlib lets the tests and tools use the engine.
[lib]
name = "parsec_orbit_plugin_js_runtime"
crate-type = ["cdylib", "rlib"]

[dependencies]
parsec-orbit-plugin-sdk-std = { path = "../../crates/parsec-orbit-plugin-sdk-std" }
# No `temporal`/`intl`: they pull in the ICU data and double the size, and
# plugins have no use for calendars.
boa_engine = { version = "0.22", default-features = false }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["parse", "std"] }
