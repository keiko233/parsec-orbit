[package]
name = "parsec-orbit-market"
description = "Plugin index, sha256 and ed25519 verification, safe installation and the parsec-orbit-market command line tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "parsec_orbit_market"
path = "src/lib.rs"

[[bin]]
name = "parsec-orbit-market"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
getrandom = "0.4.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
toml = "1.1.8"
ureq = "3.4.2"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
