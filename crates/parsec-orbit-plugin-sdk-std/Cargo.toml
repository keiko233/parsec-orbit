[package]
name = "parsec-orbit-plugin-sdk-std"
description = "std companions of the Parsec Orbit plugin SDK: threads, panic hook, tracing bridge and a mock host for unit tests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["parsec", "plugin", "sdk", "testing", "windows"]
categories = ["development-tools", "os::windows-apis"]
rust-version = "1.81"
publish = false

[features]
default = []
# ContextExt::install_tracing(): forwards `tracing` events to the loader log.
tracing = ["dep:tracing-core"]

[dependencies]
parsec-orbit-plugin-sdk = { path = "../parsec-orbit-plugin-sdk" }
tracing-core = { version = "0.1", optional = true }

[dev-dependencies]
# Turns the optional feature on for this crate's own tests.
parsec-orbit-plugin-sdk-std = { path = ".", features = ["tracing"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lib]
name = "parsec_orbit_plugin_sdk_std"
path = "src/lib.rs"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
all-features = true
