[package]
name = "parsec-orbit-plugin-ui"
description = "Parsec Orbit UI service: external companion window for Orbit and plugin settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "parsec_orbit_plugin_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
parsec-orbit-plugin-sdk-std = { path = "../../crates/parsec-orbit-plugin-sdk-std" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
winio = { version = "0.12.0", default-features = false, features = ["win32", "windows-dark-mode"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }
