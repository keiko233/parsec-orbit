[package]
name = "parsec-orbit-plugin-config"
description = "Parsec Orbit plugin that provides parsec-orbit.config: settings that survive restarts, one JSON file per plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "parsec_orbit_plugin_config"
crate-type = ["cdylib", "rlib"]

[dependencies]
parsec-orbit-plugin-sdk-std = { path = "../../crates/parsec-orbit-plugin-sdk-std" }
serde_json = "1"
