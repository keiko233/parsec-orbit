[package]
name = "parsec-orbit-winui-bindings"
description = "Generated WinUI 3 bindings for the controls winio does not wrap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Windows-only: on other targets the crate compiles to an empty library.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Globalization_NumberFormatting",
    "System",
    "UI_Core",
    "UI_Text",
] }
windows-core = "0.62.2"
windows-collections = "0.100.0"
windows-future = "0.3.2"
windows-numerics = "0.100.0"
