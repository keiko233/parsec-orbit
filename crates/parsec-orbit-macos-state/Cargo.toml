[package]
name = "parsec-orbit-macos-state"
description = "Shared macOS host-state primitives: verified atomic seeding of the isolated client state"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
publish = false

[lib]
name = "parsec_orbit_macos_state"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
parsec-orbit-core = { path = "../parsec-orbit-core", features = ["testutil"] }
