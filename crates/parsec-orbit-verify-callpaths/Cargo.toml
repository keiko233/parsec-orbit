[package]
name = "parsec-orbit-verify-callpaths"
description = "Checks that the loader forwards calls to the real bcrypt.dll unchanged"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "callpaths"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }
