[package]
name = "parsec-orbit-ui-companion"
description = "Out-of-process native UI companion for Parsec Orbit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "parsec-orbit-ui-companion"
path = "src/main.rs"

[dependencies]
parsec-orbit-ui-protocol = { path = "../parsec-orbit-ui-protocol" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winio = { version = "0.12.0", default-features = false, features = ["winui"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "macos")'.dependencies]
winio = { version = "0.12.0", default-features = false }
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSApplication",
    "NSClipView",
    "NSMenu",
    "NSMenuItem",
    "NSScrollView",
    "NSTabView",
    "NSView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFRunLoop"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString"] }
