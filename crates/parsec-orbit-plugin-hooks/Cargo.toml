[package]
name = "parsec-orbit-plugin-hooks"
description = "Parsec Orbit plugin that provides the platform hooks service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "parsec_orbit_plugin_hooks"
crate-type = ["cdylib", "rlib"]

[dependencies]
parsec-orbit-plugin-sdk-std = { path = "../../crates/parsec-orbit-plugin-sdk-std" }

# Inline detours are Windows-only; macOS uses its own import-pointer backend.
[target.'cfg(windows)'.dependencies]
retour = { version = "0.3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
