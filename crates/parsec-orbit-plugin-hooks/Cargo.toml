[package]
name = "parsec-orbit-plugin-hooks"
description = "Parsec Orbit plugin that provides parsec-orbit.hooks: inline hooks on functions of the client process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "parsec_orbit_plugin_hooks"
crate-type = ["cdylib", "rlib"]

[dependencies]
parsec-orbit-plugin-sdk-std = { path = "../../crates/parsec-orbit-plugin-sdk-std" }

# Windows-only: on other targets the crate compiles to an empty library.
[target.'cfg(windows)'.dependencies]
retour = { version = "0.3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
