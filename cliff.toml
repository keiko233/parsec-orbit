# git-cliff configuration for parsec-orbit.
#
# Used by .github/workflows/release.yml to build the GitHub Release notes:
#
#   git-cliff --latest --strip all --output RELEASE_NOTES.md
#
# Preview locally with:
#
#   git-cliff --unreleased --strip all
#   git-cliff --output CHANGELOG.md
#
# The repo follows conventional commits (feat:, fix:, refactor:, chore:, ...),
# so no extra git history rewriting is needed.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here.
Generated by [git-cliff](https://git-cliff.org); do not edit by hand.

"""
body = """
{% if version -%}
  ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
  ## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim | upper_first }}
  {% for commit in commits %}
  - {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/keiko233/parsec-orbit/commit/{{ commit.id }}))
  {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 03 -->Code Refactoring" },
  { message = "^docs?", group = "<!-- 04 -->Documentation" },
  { message = "^test", group = "<!-- 05 -->Testing" },
  { message = "^build|ci", group = "<!-- 06 -->Build" },
  { message = "^chore", group = "<!-- 07 -->Miscellaneous" },
  { message = "^revert", group = "<!-- 08 -->Reverts" },
]

[remote.github]
owner = "keiko233"
repo = "parsec-orbit"
