[package]
name = "parsec-orbit-ui-companion"
description = "Out-of-process native UI companion for Parsec Orbit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "parsec-orbit-ui-companion"
path = "src/main.rs"

[dependencies]
parsec-orbit-ui-protocol = { path = "../../crates/parsec-orbit-ui-protocol" }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winio = { version = "0.12.0", default-features = false, features = ["winui"] }
# The window's canvas is a winio-winui3 type; the Fluent shell is attached to it.
winio-winui3 = { version = "0.4.5", features = ["UI_Xaml"] }
parsec-orbit-winui-bindings = { path = "../../crates/parsec-orbit-winui-bindings" }
windows = { version = "0.62.2", features = ["Foundation", "System"] }
windows-core = "0.62.2"
windows-collections = "0.100.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
] }

[target.'cfg(target_os = "macos")'.dependencies]
winio = { version = "0.12.0", default-features = false }
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSBox",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGlassEffectView",
    "NSImage",
    "NSImageCell",
    "NSImageView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSLayoutManager",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSScrollView",
    "NSSlider",
    "NSSliderCell",
    "NSSplitViewController",
    "NSSplitViewItem",
    "NSStackView",
    "NSStepper",
    "NSStepperCell",
    "NSSwitch",
    "NSTabView",
    "NSTableCellView",
    "NSTableColumn",
    "NSTableRowView",
    "NSTableView",
    "NSText",
    "NSTextContainer",
    "NSTextField",
    "NSTextFieldCell",
    "NSTextStorage",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSViewController",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFRunLoop"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSString", "NSArray", "NSGeometry", "NSIndexSet", "NSNotification", "NSObject", "NSRange", "NSValue"] }
