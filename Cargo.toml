[workspace]
resolver = "2"
members = [
    "parsec-orbit-loader",
    "parsec-orbit-plugin-sdk",
    "plugins/parsec-orbit-plugin-webview",
    "plugins/parsec-orbit-plugin-native",
    "examples/parsec-orbit-plugin-hello",
    "verify/parsec-orbit-verify-callpaths",
    "verify/parsec-orbit-verify-roundtrip",
    "verify/parsec-orbit-verify-webview-inject",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/keiko233/parsec-orbit"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
