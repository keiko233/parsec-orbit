[workspace]
resolver = "2"
members = [
    "loader",
    "patches",
    "sdk",
    "examples/hello-plugin",
    "verify/callpaths",
    "verify/roundtrip",
    "verify/webview-inject",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/keiko233/parsec-orbit"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
