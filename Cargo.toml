[workspace]
resolver = "2"
members = [
    "tools/parsec-orbit-installer-macos",
    "crates/parsec-orbit-loader-windows",
    "crates/parsec-orbit-loader-macos",
    "crates/parsec-orbit-macos-state",
    "crates/parsec-orbit-plugin-abi",
    "crates/parsec-orbit-plugin-sdk",
    "crates/parsec-orbit-plugin-sdk-testing",
    "crates/parsec-orbit-core",
    "crates/parsec-orbit-layout",
    "crates/parsec-orbit-market",
    "libs/parsec-orbit-lib-webview-bridge",
    "libs/parsec-orbit-lib-config",
    "libs/parsec-orbit-lib-ui",
    "libs/parsec-orbit-lib-hooks",
    "libs/parsec-orbit-lib-js-runtime",
    "plugins/parsec-orbit-plugin-high-bitrate-webview",
    "plugins/parsec-orbit-plugin-high-bitrate-native",
    "plugins/parsec-orbit-plugin-stun-swap",
    "examples/parsec-orbit-plugin-hello",
    "examples/parsec-orbit-plugin-hello-nostd",
    "tools/parsec-orbit-verify",
    "tests/parsec-orbit-e2e",
    "tests/parsec-orbit-fixture-plugin",
    "tests/parsec-orbit-fixture-nostd",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/keiko233/parsec-orbit"

# Versions of the crates published to crates.io. The Publish workflow bumps
# these together with `[workspace.package] version`.
[workspace.dependencies]
parsec-orbit-plugin-abi = { path = "crates/parsec-orbit-plugin-abi", version = "0.1.1" }
parsec-orbit-plugin-sdk = { path = "crates/parsec-orbit-plugin-sdk", version = "0.1.1" }
parsec-orbit-plugin-sdk-testing = { path = "crates/parsec-orbit-plugin-sdk-testing", version = "0.1.1" }

# A `no_std` plugin cannot unwind, so it needs `panic = "abort"` in every
# profile it is built with, not only in release.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# Size matters more than speed here: the loader is a proxy DLL sitting in
# front of a foreign process, and the hot path is a plain jump.
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
